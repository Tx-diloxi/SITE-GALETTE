services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: jalg_php
    ports:
      - "8080:80"
    volumes:
      - ./jaimelagalette:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      PHP_DATE_TIMEZONE: Europe/Paris
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEBUG: ${MAIL_DEBUG}
    networks:
      - jalg_network

  db:
    image: mysql:8.0
    container_name: jalg_db
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - jalg_db_data:/var/lib/mysql
      - ./docker/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jalg_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jalg_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jalg_network

volumes:
  jalg_db_data:

networks:
  jalg_network:
    driver: bridge
